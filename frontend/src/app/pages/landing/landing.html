<ms-ascii-background mode="hero" />

<header class="flex items-center justify-end px-4 pt-[max(1rem,env(safe-area-inset-top))] sm:px-8 sm:pt-6">
  <ms-theme-toggle />
</header>

<main class="flex flex-1 flex-col items-center justify-center px-4 text-center">
  <a
    [routerLink]="auth.isLoggedIn() ? '/feed' : '/ingresar'"
    class="group relative animate-rise rounded-full focus-visible:outline-2 focus-visible:outline-offset-8 focus-visible:outline-primary"
    aria-label="Ingresar a MaxSend"
  >
    <span class="absolute -inset-1/3 -z-10 animate-glow rounded-full bg-[radial-gradient(circle,rgb(var(--glow-rgb)/0.4),transparent_65%)]"></span>
    <ms-logo
      size="100%"
      class="w-[clamp(132px,34vw,220px)] animate-float drop-shadow-[0_0_28px_rgb(var(--glow-rgb)/0.6)] transition duration-500 group-hover:scale-105"
    />
  </a>

  <h1 class="mt-8 animate-rise text-4xl font-bold tracking-tight [animation-delay:150ms] sm:text-5xl">
    Max<span class="brand-text">Send</span>
  </h1>
  <p class="mt-3 animate-rise font-display text-xs tracking-[0.42em] text-muted uppercase [animation-delay:250ms] sm:text-sm">
    Conectá sin límites
  </p>

  <div class="mt-10 flex w-full max-w-xs animate-rise flex-col gap-3 [animation-delay:400ms]">
    @if (auth.isLoggedIn()) {
      <a class="btn btn-primary" routerLink="/feed">Ir a mi feed</a>
    } @else {
      <a class="btn btn-primary" routerLink="/ingresar">
        Ingresar
        <svg viewBox="0 0 24 24" class="size-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </a>
      <a class="text-sm text-muted transition hover:text-fg" routerLink="/ingresar" [queryParams]="{ modo: 'registro' }">
        ¿Nuevo en MaxSend? <span class="font-semibold text-accent">Creá tu cuenta</span>
      </a>
    }
  </div>
</main>
